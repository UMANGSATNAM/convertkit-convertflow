# Railway / Nixpacks build configuration
# Runs template build scripts before the main Remix build

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
  "node build-html.js",
  "node build-liquid-sections.js",
  "npm run build"
]

[start]
cmd = "npm run start"
