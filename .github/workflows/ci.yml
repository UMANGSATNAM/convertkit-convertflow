name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      
      - name: Lint
        run: npm run lint
        continue-on-error: true # For now

      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true # For now

      - name: Prisma Generate
        run: npx prisma generate

      - name: Build
        run: npm run build
        
      - name: Test
        run: npm run test

      - name: Validate Themes
        run: |
          for d in themes/*/ ; do
            if [ -d "$d" ]; then
              npm run validate:theme "$d"
            fi
          done
