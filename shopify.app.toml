# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "616431d20b1e35e8672963828655d4b1"
name = "convertkit-convertflow"
application_url = "https://shopifyapp.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "checkouts/create" ]
  uri = "/webhooks/checkouts/create"

  [[webhooks.subscriptions]]
  topics = [ "checkouts/update" ]
  uri = "/webhooks/checkouts/update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_products,write_orders,read_orders,write_discounts,read_discounts,read_customers,write_themes,read_themes,write_pages,read_pages,write_script_tags,read_script_tags,read_analytics"

[auth]
redirect_urls = [
  "https://shopifyapp.up.railway.app/auth/callback",
  "https://shopifyapp.up.railway.app/auth/shopify/callback",
  "https://shopifyapp.up.railway.app/api/auth/callback"
]
